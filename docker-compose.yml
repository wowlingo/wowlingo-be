version: '3.8'

services:
  database:
    image: mysql:8.4
    container_name: wowlingo_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: wowlingo
      MYSQL_USER: root
      MYSQL_PASSWORD: root1234
    ports:
      - "23306:3306"
    volumes:
      - db_data:/var/lib/mysql
    
volumes:
  db_data: